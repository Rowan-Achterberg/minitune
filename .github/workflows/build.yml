name: 打包安装程序
# 修改 package.json 里的版本号并推送，就会自动打包并发布到 Releases
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:x64
      - run: npm run dist:arm64
      - id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: MiniTune-Windows
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: MiniTune ${{ steps.ver.outputs.v }}
          files: dist/*.exe
